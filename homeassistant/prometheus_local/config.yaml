name: Prometheus Local
version: "0.1.0"
slug: prometheus_local
description: Local Prometheus server with persistent metrics retention
url: https://github.com/fiddeb/myuplink-exporter
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  9090/tcp: 9090
ports_description:
  9090/tcp: Prometheus UI and query API (no authentication; trusted LAN only)
webui: http://[HOST]:[PORT:9090]
options:
  targets:
    - local-myuplink-cloud:8080
  retention_days: 180
  retention_size_gb: 2
  scrape_interval_seconds: 60
schema:
  targets:
    - str
  retention_days: int(1,3650)
  retention_size_gb: int(1,64)
  scrape_interval_seconds: int(15,3600)
