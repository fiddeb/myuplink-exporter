name: myUplink Cloud telemetry
version: "0.2.0"
slug: myuplink_cloud
description: myUplink exporter and Alloy for Grafana Cloud logs and metrics
url: https://github.com/fiddeb/myuplink-exporter
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
options:
  client_id: ""
  client_secret: ""
  loki_url: ""
  loki_user: ""
  loki_token: ""
  metrics_url: ""
  metrics_user: ""
  metrics_token: ""
  instance: homeassistant
  poll_interval: 60
  poll_timeout: 55
  request_interval: 3
schema:
  client_id: str
  client_secret: password
  loki_url: url
  loki_user: str
  loki_token: password
  metrics_url: url
  metrics_user: str
  metrics_token: password
  instance: str
  poll_interval: int(30,3600)
  poll_timeout: int(10,600)
  request_interval: int(1,60)
