name: ci/homeassistant
on:
  pull_request:
  push:
    branches: [main, improve-monitoring]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install homeassistant==2026.10.4 prometheus-client==0.21.0 pytest pytest-asyncio
      - run: python -m pytest tests/homeassistant -v
      - run: python -m unittest discover -s homeassistant/myuplink_cloud -v
      - run: python -m unittest discover -s homeassistant/prometheus_local -v
